name: Showcase — built with zero
description: Share a project, app, or service you built with zero so we can feature it.
title: "[showcase] "
labels: ["showcase"]
body:
  - type: input
    id: name
    attributes:
      label: Project name
      placeholder: e.g. acme-api
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link (repo, site, or demo)
      placeholder: https://github.com/you/acme-api
    validations:
      required: true
  - type: dropdown
    id: backends
    attributes:
      label: Which zero features did you use?
      multiple: true
      options:
        - REST / AutoCRUD
        - SQL (Postgres/SQLite/DuckDB/Cassandra)
        - Pub/Sub (Kafka/MQTT/NATS/Redis/SQS/GCP)
        - Auth (Basic/APIKey/OAuth2)
        - GraphQL
        - Protobuf
        - Cron
        - WebSockets
        - Metrics / Tracing
  - type: textarea
    id: notes
    attributes:
      label: One line on what it does + why zero
      placeholder: A multi-tenant billing API; zero's config-driven Postgres + OAuth saved us a week.
    validations:
      required: false
