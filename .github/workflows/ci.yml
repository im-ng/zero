name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit_test_and_coverage:
    runs-on: ubuntu-latest
    container:
      image: imng/zero-kcov:0.2
      options: --security-opt seccomp=unconfined

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set Zig 0.16.0 as active
        run: |
          zig version
          kcov --version
          more /etc/os-release

      - name: Run tests with coverage
        run: |
          mkdir -p ~/.cache/zig/tmp
          zig build test -Dcoverage --summary all

      - name: Run integration tests (real database)
        env:
          DB_HOST: postgres
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: postgres
        run: |
          mkdir -p ~/.cache/zig/tmp
          zig build test-integration --summary all

      - name: Extract coverage
        id: coverage
        run: |
          if [ -f zig-out/kcov/test/coverage.json ]; then
            COVERAGE=$(jq -r '.percent_covered' zig-out/kcov/test/coverage.json)
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "Coverage for Zig 0.16.0: $COVERAGE%"
          else
            echo "coverage=0" >> $GITHUB_OUTPUT
            echo "Coverage for Zig 0.16.0: 0%"
          fi

      - name: Update README with coverage
        if: github.event.pull_request.merged == true
        run: |
          NEW_COVERAGE=$(jq -r '.percent_covered' zig-out/kcov/test/coverage.json | cut -d. -f1)
          echo "Updating coverage to ${NEW_COVERAGE}%"
          if [ "$NEW_COVERAGE" -lt 85 ]; then
            COLOR="red"
          elif [ "$NEW_COVERAGE" -ge 95 ]; then
            COLOR="green"
          else
            COLOR="yellow"
          fi
          sed -i "s/Coverage-[0-9]*\.[0-9]*-[a-z]*/Coverage-${NEW_COVERAGE}-${COLOR}/; s/Coverage-[0-9]*%-[a-z]*/Coverage-${NEW_COVERAGE}-${COLOR}/" readme.md
  
          git config --global --add safe.directory /__w/zero/zero
          git config --global user.name "im-ng"
          git config --global user.email "2039564+im-ng@users.noreply.github.com"
          git add readme.md
          git commit -m "chore: update coverage to $COVERAGE%" || echo "No changes to commit"

      - name: Push coverage update
        if: github.event.pull_request.merged == true
        run: |
          git push

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero_coverage
          path: zig-out/kcov/test/coverage.json